name: JobShield CI

on:
  push:
    branches: [main, "forge/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify evidence and review integrity
        run: node --test tests/jobshield-core.test.js
      - name: Check browser script syntax
        run: node --check jobshield-core.js
